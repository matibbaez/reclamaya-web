<section class="faq-section">
  <div class="container">
    
    <div class="section-header">
      <span class="badge">Dudas Comunes</span>
      <h2>Preguntas Frecuentes</h2>
      <p>Resolvemos tus inquietudes para que inicies tu reclamo con total confianza.</p>
    </div>

    <div class="faq-list">
      <div class="faq-item" *ngFor="let item of faqs; let i = index" 
           [class.active]="faqOpen === i" 
           (click)="toggleFaq(i)">
        
        <div class="faq-head">
          <span class="question-text">{{ item.pregunta }}</span>
          
          <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>
        </div>
        
        <div class="faq-body" [class.show]="faqOpen === i">
          <div class="body-content">
            <p>{{ item.respuesta }}</p>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
