<nav class="navbar" [class.menu-abierto]="menuAbierto" [class.scrolled]="isScrolled" [class.dark-bg]="!isHome">
  <div class="navbar-container">
    
    <a class="brand-logo" routerLink="/" (click)="cerrarMenu()">
      <img src="reclamaa.png" alt="Reclama Ya" class="logo-img">
    </a>
    
    <div class="navbar-links-desktop">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link">Inicio</a>
      <!-- <a routerLink="/productores" routerLinkActive="active" class="nav-link">Productores</a> -->
      <a routerLink="/iniciar-reclamo" routerLinkActive="active" class="nav-link">Iniciar Reclamo</a>
      <a routerLink="/consultar-tramite" routerLinkActive="active" class="nav-link">
        Consultar Estado
      </a>
      
      <a *ngIf="authService.isAuthenticated() && !authService.esAdmin" 
         routerLink="/mis-referidos" 
         routerLinkActive="active" 
         class="btn-productor">
         <ng-container *ngIf="authService.esTramitador">Soy Tramitador</ng-container>
         <ng-container *ngIf="authService.esOrganizador">Soy Broker</ng-container>
         <ng-container *ngIf="authService.esProductor">Soy Productor</ng-container>
      </a>

      <ng-container *ngIf="authService.esAdmin">
        <a routerLink="/admin-dashboard" class="nav-link highlight">Panel Admin</a>
        <a routerLink="/mi-equipo" class="nav-link highlight">Equipo</a>
      </ng-container>

      <a *ngIf="!authService.isAuthenticated()" 
        routerLink="/productores" 
        class="btn-productor-nav">
        Acceso Productores
      </a>

      <a *ngIf="!authService.isAuthenticated()" routerLink="/login" class="btn-login">
        Ingresar
      </a>

      <button *ngIf="authService.isAuthenticated()" class="btn-logout" (click)="cerrarSesion()" title="Cerrar Sesión">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 3h6a2 2 0 012 2v4" />
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 17v4H8a2 2 0 01-2-2V5a2 2 0 012-2" />
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 12h9m0 0l-3-3m3 3l-3 3" />
        </svg>
      </button>

    </div>

    <button class="mobile-menu-button" (click)="toggleMenu()">
      <span></span><span></span><span></span>
    </button>

  </div>

  <div class="mobile-menu-dropdown" [class.abierto]="menuAbierto">
    <a routerLink="/" (click)="cerrarMenu()">Inicio</a>
    <a routerLink="/iniciar-reclamo" (click)="cerrarMenu()">Iniciar Reclamo</a>
    <a routerLink="/consultar-tramite" (click)="cerrarMenu()">Consultar</a>
    <a routerLink="/productores" (click)="cerrarMenu()" class="highlight-mobile-productores">Acceso Productores</a>
    
    <div class="divider" *ngIf="authService.isAuthenticated()"></div>

    <a *ngIf="authService.esProductor" routerLink="/mis-referidos" (click)="cerrarMenu()" class="highlight-mobile">
      Soy Productor
    </a>

    <a *ngIf="authService.esOrganizador" routerLink="/mis-referidos" (click)="cerrarMenu()" class="highlight-mobile">
      Soy Broker
    </a>

    <a *ngIf="authService.esTramitador" routerLink="/mis-referidos" (click)="cerrarMenu()" class="highlight-mobile">
      Soy Tramitador
    </a>

    <a *ngIf="authService.esAdmin" routerLink="/admin-dashboard" (click)="cerrarMenu()" class="highlight-mobile">Admin Panel</a>
    <a *ngIf="authService.esAdmin" routerLink="/mi-equipo" (click)="cerrarMenu()" class="highlight-mobile">Equipo</a>

    <div class="actions-mobile">
      <a *ngIf="!authService.isAuthenticated()" routerLink="/login" (click)="cerrarMenu()" class="btn-mobile-login">Ingresar</a>
      <button *ngIf="authService.isAuthenticated()" class="btn-mobile-logout" (click)="cerrarSesion()">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M9 3h6a2 2 0 012 2v4" />
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M16 17v4H8a2 2 0 01-2-2V5a2 2 0 012-2" />
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M12 12h9m0 0l-3-3m3 3l-3 3" />
        </svg>
        Cerrar Sesión
      </button>
    </div>
  </div>
</nav>
