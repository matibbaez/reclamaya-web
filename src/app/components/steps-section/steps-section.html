<section class="steps-section">
  <div class="container">
    
    <div class="section-header">
      <span class="badge">Proceso Simplificado</span>
      <h2>Tu reclamo, resuelto<span>Ya.</span></h2>
      <p>Nosotros nos encargamos de la burocracia para que vos recuperes lo tuyo.</p>
    </div>

    <div class="steps-wrapper">
      <div class="mobile-timeline-line"></div>

      <div class="step-item" *ngFor="let step of steps">
        
        <div class="step-icon-col">
          <div class="icon-circle" [style.background]="step.gradient" [style.box-shadow]="'0 8px 20px -6px ' + step.shadow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path [attr.d]="step.iconPath"></path>
            </svg>
          </div>
        </div>

        <div class="step-card">
          <span class="step-number" [ngClass]="step.colorClass">PASO {{ step.num }}</span>
          <h3>{{ step.title }}</h3>
          <p>{{ step.desc }}</p>
        </div>

      </div>
    </div>

  </div>
</section>
